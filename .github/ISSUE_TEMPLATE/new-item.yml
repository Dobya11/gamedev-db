name: New item
description: Suggest a game development resource for the database
title: "[New item]: "
body:
  - type: markdown
    attributes:
      value: Suggest a resource to add to the database. Please provide accurate details and licensing information.
  - type: input
    id: name
    attributes:
      label: Resource name
      placeholder: Name of the tool, website, asset library, or other resource
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Resource URL
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Briefly explain what the resource offers.
    validations:
      required: true
  - type: input
    id: keywords
    attributes:
      label: Keywords
      description: List of words that describes your resource. Specify what kind of resource it is.
      placeholder: Game assets, library, 2d, pixel art...
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing
      options:
        - Free
        - Freemium
        - Paid
        - Varies
    validations:
      required: true
  - type: dropdown
    id: commercial-use
    attributes:
      label: Commercial use
      description: Check the resource's license or terms of use.
      options:
        - "Yes"
        - "No"
        - Limited
        - Varies
    validations:
      required: true
